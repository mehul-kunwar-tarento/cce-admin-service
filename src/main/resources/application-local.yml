# Local only, used with SPRING_PROFILES_ACTIVE=local.
# Values for the docker compose environment (docker-compose.yml). Secrets are read from .env, never written here.

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/admin_service}
    username: ${DB_USERNAME:admin_service}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD}}

# Local values of the JWT_* variables: realm "cce" and the audience its tokens carry (README)
JWT_ISSUER: http://localhost:8180/realms/cce
JWT_AUDIENCE: cce-admin-service

# The Keycloak in docker compose, and the user local/create-superadmin.sh makes
KEYCLOAK_BASE_URL: http://localhost:8180
BOOTSTRAP_ADMIN_USERNAME: superadmin
