# Settings for every environment. Only environment-neutral defaults live here;
# every localhost value is in application-local.yml.

server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: cce-admin-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Fail fast when the database is down (default is 30s), so /health and API calls answer quickly
      connection-timeout: 2000
      validation-timeout: 1000
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens must come from this Keycloak realm
          issuer-uri: ${JWT_ISSUER}
          # and be meant for this service: the token's aud must contain this value
          audiences: ${JWT_AUDIENCE}
          # Keycloak's public keys; fetched on the first token and cached, not at startup
          jwk-set-uri: ${JWT_JWK_SET_URI:${JWT_ISSUER}/protocol/openid-connect/certs}
  flyway:
    # ccedb on servers is shared and never empty (other services' tables, gateway's api_permissions),
    # so start a history table there instead of refusing; version 0 means V1 and V2 still both run
    baseline-on-migrate: true
    baseline-version: 0
    # Each service sharing the database keeps its own migration history
    table: flyway_schema_history_admin
  jpa:
    open-in-view: false
    hibernate:
      # Tables come only from Flyway migrations, never from Java classes
      ddl-auto: none

cce:
  jwt:
    # Where the token keeps the caller's roles; the gateway must read the same path for the same realm
    roles-claim-path: ${JWT_ROLES_CLAIM_PATH:realm_access.roles}
  keycloak:
    # Keycloak's address; required, the localhost value lives only in application-local.yml
    base-url: ${KEYCLOAK_BASE_URL}
    realm: ${KEYCLOAK_REALM:cce}
    client-id: ${KEYCLOAK_CLIENT_ID:cce-admin-service}
    # This service's own login to the Keycloak Admin API; from the environment, never written in a file
    client-secret: ${KEYCLOAK_CLIENT_SECRET}
  bootstrap:
    # Keycloak user linked as the first admin on startup; unset = do nothing
    admin-username: ${BOOTSTRAP_ADMIN_USERNAME:}
